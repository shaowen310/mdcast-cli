[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcast-cli"
version = "0.1.0"
description = "A CLI tool to convert Markdown to DOCX and vice versa"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "python-docx>=0.8.11",
    "Pillow>=9.0",
]

[project.optional-dependencies]
vector = [
    "pillow-emf>=0.2",
    "PyMuPDF>=1.20",
]

[project.scripts]
mdcast = "mdcast.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src/mdcast/converters/docx2md/tests"]
