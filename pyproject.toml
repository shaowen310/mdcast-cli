[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdcast-cli"
version = "0.1.0"
description = "A CLI tool to convert Markdown to DOCX and vice versa"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.2.0",
    "python-pptx>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
vector = [
    "PyMuPDF>=1.24.0",
]

[project.scripts]
mdcast = "mdcast.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src/mdcast/converters/docx2md/tests"]

[tool.basedpyright]
# Relax rules that only flag untyped third-party libs (python-pptx, lxml)
# and deliberately-optional TypedDict fields used throughout the converters.
# These are not real code defects, so they're silenced project-wide to keep
# the IDE/linter output focused on genuine issues.
reportTypedDictNotRequiredAccess = false
reportExplicitAny = false
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
